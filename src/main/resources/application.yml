server:
  port: ${SERVER_PORT}
  http2:
    enabled: true
  compression:
    enabled: true
  error:
    include-binding-errors: always

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    url: ${POSTGRES_URL}

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        connection:
          autocommit: false
        format_sql: true
  aop:
    auto: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVER}
    listener:
      ack-mode: batch
    consumer:
      client-id: ${KAFKA_CLIENT_ID}
      auto-offset-reset: earliest
    template:
      default-topic: ${KAFKA_TOPIC_NAME}



  mail:
   host: ${MAIL_HOST}
   port: ${MAIL_PORT}
   username: ${MAIL_USERNAME}
   password: ${MAIL_PASSWORD}
   properties:
     mail:
       smtp:
         auth: true
         starttls:
           enable: true
       transport:
         protocol: smtp

  batch:
    job:
      enabled: true

  config:
    import: optional:file:.env[.properties]
  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: true
      lettuce:
        pool:
          enabled: true

  cache:
    type: redis
    redis:
      time-to-live: 5
      enable-statistics: true
  threads:
    virtual:
      enabled: true
  task:
    scheduling:
      pool:
        size: 4
      shutdown:
        await-termination: true
  jackson:
    date-format: java.text.SimpleDateFormat

logging:
  level:
    web: info
    sql: info
    root: info
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
stripe:
  secret:
    api-key: ${STRIPE_API_KEY}
account:
  secret:
    id: ${STRIPE_ACCOUNT_ID}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
open-api:
  contact:
    name: ${OPEN_API_CONTACT_NAME}
    email: ${MAIL_USERNAME}
  info:
    title: ${OPEN_API_CONTACT_TITLE}
    version: ${OPEN_API_CONTACT_VERSION}
    description: ${OPEN_API_CONTACT_DESCRIPTION}
  server:
    description: ${OPEN_API_SERVER_DESCRIPTION}


