server:
  http2:
    enabled: true
  compression:
    enabled: true
  error:
    include-binding-errors: always
    include-message: on_param
    include-path: always
    path: /error
    whitelabel:
      enabled: true
  tomcat:
    resource:
      allow-caching: true
  port: 3000
  servlet:
    encoding:
      charset: UTF-8

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    username: daniilnovikov
    password: demo2228
    url: jdbc:postgresql://localhost:5432/postgres
  web:
    resources:
      static-locations: classpath:/static/
  #  elasticsearch:
#    uris: ${ELASTIC_URI}
#    username: ${ELASTIC_USERNAME}
#    password: ${ELASTIC_PASSWORD}
  config:
    import: optional:file:.env[.properties]
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        connection:
          autocommit: false
        format_sql: true
  aop:
    auto: true
  rabbitmq:
      host: localhost
      port: 5672
      listener:
        direct:
          acknowledge-mode: manual
      password: guest
      username: guest



#  mail:
