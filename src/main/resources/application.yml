order:
  discount:
    value: 10
  limit:
    value: 5
rabbitMq:
  queueName: ${RABBIT_MQ_QUEUE_NAME}
  topicExchangeName: ${RABBIT_MQ_TOPIC_NAME}
  routingKey: ${RABBIT_MQ_ROUTING_KEY}
  directExchange: ${RABBIT_MQ_DIRECT_EXCHANGE}
  ttl: ${RABBIT_TTL}
  headerName: ${RABBIT_HEADER_NAME}


