server:
  http2:
    enabled: true
  compression:
    enabled: true
  error:
    include-binding-errors: always
    include-message: on_param
    include-path: always
    path: /error
    whitelabel:
      enabled: true
  tomcat:
    resource:
      allow-caching: true
  port: ${SERVER_PORT}
  servlet:
    encoding:
      charset: UTF-8
  shutdown: graceful

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    url: ${POSTGRES_URL}
  web:
    resources:
      static-locations: classpath:/static/
  lifecycle:
    timeout-per-shutdown-phase: 20s
  output:
    ansi:
      enabled: always
  config:
    import: optional:file:.env[.properties]
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        connection:
          autocommit: false
        format_sql: true
  aop:
    auto: true
  spring:
    kafka:
      bootstrap-servers: localhost:9092
      producer:
        key-serializer: org.apache.kafka.common.serialization.StringSerializer
        value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
        acks: all
        retries: 3
      consumer:
        group-id: jasm-consumer-group
        auto-offset-reset: earliest
        enable-auto-commit: false
        key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
        properties:
          spring.json.trusted.packages: "dn.jasm.*"
      listener:
        ack-mode: manual




  #  mail:
#   host: ${MAIL_HOST}
#   port: ${MAIL_PORT}
#   username: ${MAIL_USERNAME}
#   password: ${MAIL_PASSWORD}
#   properties:
#     mail:
#       smtp:
#         auth: true
#         starttls:
#           enable: true
#       transport:
#         protocol: smtp

  batch:
    job:
      enabled: true
  devtools:
    add-properties: true


  data:
    redis:
      host: localhost
      port: 6379



  cache:
    type: redis
    redis:
      time-to-live: 5
      cache-null-values: false
      use-key-prefix: true
      enable-statistics: true

  validation:
    method:
      adapt-constraint-violations: true
  main:
    lazy-initialization: true

  threads:
    virtual:
      enabled: true
  task:
    scheduling:
      pool:
        size: 4
      shutdown:
        await-termination: true
    execution:
      shutdown:
        await-termination: true
      thread-name-prefix: ${THREAD_NAME_PREFIX}

  jackson:
    date-format: ${JACKSON_DATE_FORMAT}
  mvc:
    async:
      request-timeout: 5
  servlet:
    multipart:
      enabled: true
  kafka:
    template:
      default-topic: "jasm-topic"

logging:
  level:
    web: info
    sql: info
    root: info
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
stripe:
  secret:
    api-key: ${STRIPE_API_KEY}
  account:
    key: ${STRIPE_ACCOUNT_KEY}
springdoc:
  swagger-ui:
    path: ${SWAGGER_PATH}
open-api:
  contact:
    name: ${SWAGGER_OPEN_API_CONTACT_NAME}
    email: ${SWAGGER_OPEN_API_CONTACT_EMAIL}
  info:
    title: ${SWAGGER_OPEN_API_INFO_TITLE}
    version: ${SWAGGER_OPEN_API_INFO_VERSION}
    description: ${SWAGGER_OPEN_API_CONTACT_DESCRIPTION}
  server:
    description: ${SWAGGER_OPEN_API_SERVER_DESCRIPTION}

order:
  discount:
    value: ${ORDER_DISCOUNT_VALUE}
  limit:
    value: ${ORDER_LIMIT_VALUE}
rabbitMq:






s3:
  region: ${S3_REGION}
  accessKey: ${S3_ACCESSKEY}
  secretKey: ${S3_SECRET_KEY}


transactions:
  delay:
    value: 10



