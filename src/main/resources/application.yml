#         protocol: smtp

  batch:
    job:
      enabled: true


  data:
    redis:
      host: localhost
      port: 6379
      script:


  cache:
    type: redis
    redis:
      time-to-live: 5m
      cache-null-values: false
      use-key-prefix: true
      enable-statistics: true

  validation:
    method:
      adapt-constraint-violations: true
  main:
    lazy-initialization: true

  threads:
    virtual:
      enabled: true
  task:
    scheduling:
      pool:
        size: 4
      shutdown:
        await-termination: true
    execution:
      shutdown:
        await-termination: true
      thread-name-prefix: jassm-jobs

  jackson:
    date-format: java.text.SimpleDateFormat
  mvc:
    async:
      request-timeout: 5
  servlet:
    multipart:
      enabled: true

